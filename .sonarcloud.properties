# Configuração da análise automática do SonarQube Cloud (app do GitHub; roda a cada push).
# Referência: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/

# Código de produção: apps, libs, infraestrutura (manifestos e scripts), imagem e workflows.
sonar.sources=apps,libs,infra,docker,scripts,.github
sonar.sourceEncoding=UTF-8

# Código de teste: specs ao lado do código, suítes de integração/E2E, BDD, carga (k6) e os
# fakes/utilitários de teste (libs/*/src/testing, test/support). Regras de teste, não de produção.
sonar.tests=apps,libs,tests,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.int-spec.ts,apps/*/test/**,libs/*/test/**,libs/*/src/testing/**,test/**,tests/**

# Fora da análise:
#  - legacy/**: o projeto base ORIGINAL em Go, guardado de propósito como o "antes" (os problemas
#    dele são o ponto de partida documentado em docs/arquitetura.md §1.2, não código em uso);
#  - infra/db/schema/**: referência gerada por pg_dump (PostgreSQL); o analisador de SQL do Sonar é
#    de PL/SQL (Oracle) e acusa regras que não existem no PostgreSQL. A fonte da verdade do schema
#    são as migrações em apps/*/src/database/migrations, que SÃO analisadas;
#  - examples/**: vídeos de exemplo; coverage/ e dist/: artefatos gerados.
#  - os testes (listados acima) saem de sonar.sources para não serem indexados duas vezes.
sonar.exclusions=legacy/**,infra/db/schema/**,examples/**,coverage/**,dist/**,**/node_modules/**,**/*.spec.ts,**/*.e2e-spec.ts,**/*.int-spec.ts,apps/*/test/**,libs/*/test/**,libs/*/src/testing/**

# Duplicação: specs e manifestos de overlay repetem estrutura por natureza.
sonar.cpd.exclusions=**/*.spec.ts,infra/k8s/overlays/**

# HTTP sem TLS em endpoints INTERNOS: loopback, a bridge interna da VM (172.18.0.1) e Services
# ClusterIP do K3s. Esse tráfego não sai da máquina/cluster; o TLS termina na borda (Cloudflare
# Full strict -> Caddy). Ver docs/arquitetura.md, "Onde há TLS".
sonar.issue.ignore.multicriteria=httpsh,httpmjs
sonar.issue.ignore.multicriteria.httpsh.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.httpsh.resourceKey=infra/**/*.sh
sonar.issue.ignore.multicriteria.httpmjs.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.httpmjs.resourceKey=infra/**/*.mjs
