# notification-service: consome notification.events (video.failed, video.completed,
# user.deleted), envia e-mail e anonimiza notificações (LGPD). 1 réplica fixa.
# Recreate (decisão D5 do infra/vm/README.md): nunca dois consumidores do mesmo e-mail durante
# o deploy, e o pod antigo não soma na quota com o novo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: notification
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: notification
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
        fiapx.io/metrics-auth: bearer
    spec:
      priorityClassName: fiapx-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-service
          image: ghcr.io/arthurfcs98/fiapx-notification-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: notification-service-config
          env:
            - name: DB_PASSWORD_FILE
              value: /run/secrets/fiapx/DB_PASSWORD
            - name: RABBITMQ_URL_FILE
              value: /run/secrets/fiapx/RABBITMQ_URL
            - name: METRICS_TOKEN_FILE
              value: /run/secrets/fiapx/METRICS_TOKEN
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/fiapx
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 200m
              memory: 192Mi
              ephemeral-storage: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: secrets
          secret:
            secretName: fiapx-notification-service
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
