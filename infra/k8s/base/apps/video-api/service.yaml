# Service interno do video-api. Só a porta HTTP: a 9464 (métricas) nunca sai do pod por
# Service; o Prometheus lê direto do pod (contratos.md, seção 1).
apiVersion: v1
kind: Service
metadata:
  name: video-api
  labels:
    app.kubernetes.io/name: video-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: video-api
  ports:
    - name: http
      port: 3000
      targetPort: http
