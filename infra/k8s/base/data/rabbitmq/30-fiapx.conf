# RabbitMQ 4.x no K3s (montado em /etc/rabbitmq/conf.d/30-fiapx.conf; o 10-defaults.conf da
# imagem vem antes). Topologia (filas quorum, DLX, retry) NÃO fica aqui: é declarada em código
# (libs/messaging/src/topology.ts) pelos serviços a cada conexão.

## Memória: o container tem limite de 512 MiB (infra/vm/README.md, seção 4.3). Com o padrão
## (40% da RAM que o Erlang enxerga) o alarme de memória dispararia tarde demais. Valor
## absoluto: acima disso o broker bloqueia publishers (o outbox segura os eventos).
vm_memory_high_watermark.absolute = 300MiB

## Disco: o PVC tem 1 GiB. Abaixo de 128 MB livres o broker bloqueia publishers.
disk_free_limit.absolute = 128MB

## Quorum queues: WAL menor que o padrão (512 MB) para caber no PVC e na memória.
raft.wal_max_size_bytes = 67108864

## Métricas Prometheus (porta 15692) com UMA série por fila (label "queue"): os alertas e o
## dashboard usam rabbitmq_queue_messages{queue=...}. São ~20 filas: cardinalidade baixa.
prometheus.return_per_object_metrics = true

## A API de management precisa das contagens por fila (o KEDA lê por protocolo http).
management_agent.disable_metrics_collector = false

## Logs só no stdout (o disco da imagem é somente leitura; o Alloy coleta o stdout).
log.console = true
log.console.level = info
log.file = false
