# RabbitMQ 4.3 (mesma imagem do compose), nó único, filas quorum em volume persistente.
#
# - O nome do nó é rabbit@rabbitmq-0 (hostname estável do StatefulSet): as filas "moram" no
#   diretório desse nome dentro do volume, então ele não pode mudar entre reinícios.
# - Plugins (enabled_plugins, cópia de infra/rabbitmq/enabled_plugins): os da imagem -management
#   (rabbitmq_management, rabbitmq_prometheus) + shovel e a página dele no management, que dá o
#   "Move messages" do redrive das DLQs (docs/observabilidade.md).
# - Usuário "fiapx" (administrador) criado no primeiro boot (RABBITMQ_DEFAULT_*): só o Job
#   rabbitmq-init o usa. Os apps usam um usuário cada (fiapx-api, fiapx-worker,
#   fiapx-notification, permissões mínimas) e o KEDA o fiapx-keda (só monitoramento), todos
#   criados pelo Job, que também aplica os limites por fila.
# - Probes por TCP: "rabbitmq-diagnostics" sobe outra VM Erlang (~80 MiB) a cada execução,
#   o que arriscaria OOM dentro do limite de 512 MiB.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: broker
spec:
  serviceName: rabbitmq
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/component: broker
      annotations:
        # Métricas do rabbitmq_prometheus (sem autenticação; porta só dentro do cluster).
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
        prometheus.io/path: /metrics
    spec:
      priorityClassName: fiapx-dados
      automountServiceAccountToken: false
      enableServiceLinks: false            # evita RABBITMQ_PORT=tcp://... no ambiente do broker
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 100                     # usuário "rabbitmq" da imagem alpine
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.6-management-alpine@sha256:1aab4d911053f3ee4ff9bb231f5192ebd6a12281f8044910256a667fdb04108d
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: fiapx
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: fiapx-rabbitmq
                  key: RABBITMQ_DEFAULT_PASS
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: prometheus
              containerPort: 15692
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/conf.d/30-fiapx.conf
              subPath: 30-fiapx.conf
              readOnly: true
            - name: config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 5
            failureThreshold: 60           # até 5 min (recuperação do WAL das quorum queues)
          livenessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # grava só em /var/lib/rabbitmq (cookie, dados, WAL)
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: rabbitmq
          app.kubernetes.io/part-of: fiapx
          fiapx.io/tier: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
