# Garage v2 (S3-compatível, mesma imagem do compose), nó único, metadados em SQLite
# (db_engine "sqlite": o LMDB corrompe num kill, infra/vm/README.md seção 4.3).
#
# Imagem "scratch" (só o binário /garage): sem shell. Layout, chaves S3 por serviço, buckets
# e quotas vêm do Job garage-init (infra/k8s/jobs), idempotente, a cada deploy.
# Readiness por TCP de propósito: o /health do Garage responde 503 até o layout existir, e o
# deploy.sh espera este StatefulSet ficar pronto ANTES de rodar o garage-init.
#
# Volume: 4Gi (quotas dos buckets: fiapx-raw 1 GiB + fiapx-zips 2,5 GiB; D11 do infra/vm).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/component: object-storage
spec:
  serviceName: garage
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
        app.kubernetes.io/component: object-storage
      annotations:
        # /metrics da API admin exige o metrics_token (job "garage" do Prometheus).
        prometheus.io/scrape: "true"
        prometheus.io/port: "3903"
        prometheus.io/path: /metrics
        fiapx.io/metrics-auth: garage
    spec:
      priorityClassName: fiapx-dados
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
          imagePullPolicy: IfNotPresent
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiapx-garage
                  key: GARAGE_RPC_SECRET
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fiapx-garage
                  key: GARAGE_ADMIN_TOKEN
            - name: GARAGE_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fiapx-garage
                  key: GARAGE_METRICS_TOKEN
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: data
              mountPath: /var/lib/garage/meta
              subPath: meta
            - name: data
              mountPath: /var/lib/garage/data
              subPath: data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          livenessProbe:
            tcpSocket:
              port: admin
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: garage
          app.kubernetes.io/part-of: fiapx
          fiapx.io/tier: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi
