# Produção envia e-mail pelo Resend (EMAIL_PROVIDER=resend no ConfigMap da base). A chave
# fica no Secret fiapx-notification-service (chave RESEND_API_KEY), criado pelo
# bootstrap-secrets.sh com --resend-key-file (a chave nunca passa pela linha de comando).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  template:
    spec:
      containers:
        - name: notification-service
          env:
            - name: RESEND_API_KEY_FILE
              value: /run/secrets/fiapx/RESEND_API_KEY
