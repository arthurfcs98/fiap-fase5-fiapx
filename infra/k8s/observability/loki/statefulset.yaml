# Loki (logs) em modo single binary: recebe o que o Alloy envia e responde ao Grafana.
#
# StatefulSet com volume de 1Gi e fiapx.io/tier=data (infra/vm/README.md, tabela 4.3 e regra 2
# do deploy.sh): guarda estado, então entra na camada de dados (aplicada e esperada antes dos
# Jobs e dos apps) e na prioridade fiapx-dados. Retenção de 72 h (loki.yaml, compactor).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: observability
    fiapx.io/tier: data
spec:
  serviceName: loki
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: observability
        fiapx.io/tier: data
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
        prometheus.io/path: /metrics
    spec:
      priorityClassName: fiapx-dados
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30    # flush do WAL
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                   # usuário da imagem oficial
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki.yaml
            - -target=all
          env:
            - name: GOMEMLIMIT
              value: 256MiB                # o GC aperta antes de encostar no limite (320Mi)
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 320Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: loki
          app.kubernetes.io/part-of: fiapx
          fiapx.io/tier: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# O Alloy envia para http://loki:3100 e o Grafana consulta o mesmo endereço.
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: observability
    fiapx.io/tier: data
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
