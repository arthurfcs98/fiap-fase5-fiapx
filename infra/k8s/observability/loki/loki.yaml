# Loki 3 em modo "single binary" (todos os componentes num processo), armazenamento no
# sistema de arquivos do PVC, retenção de 72 h (contratos.md, seções 12 e 13: logs podem
# conter IDs de usuário; nada fica além de 3 dias).
#
# Rótulos (índice) ficam poucos e de baixa cardinalidade: namespace, app, level. O
# correlationId vai como "structured metadata" (não indexado), o que permite filtrar por ele
# sem explodir o número de streams. Quem monta isso é o Alloy (observability/alloy).
auth_enabled: false            # instância única e interna (sem Ingress)

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  wal:
    dir: /loki/wal
  chunk_idle_period: 30m
  chunk_target_size: 1048576

# Retenção de verdade: o compactor apaga o que passou de retention_period.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 1h
  delete_request_store: filesystem

limits_config:
  retention_period: 72h
  max_query_lookback: 72h
  reject_old_samples: true
  reject_old_samples_max_age: 72h
  allow_structured_metadata: true
  volume_enabled: true
  # service_name = valor do rótulo "app" (vem do Alloy). É o rótulo que o app Logs Drilldown do
  # Grafana usa para listar os serviços ("Drilldown -> Logs"). Não cria stream novo: ele espelha
  # "app" 1:1. Rótulos finais: namespace, app, service_name e level.
  discover_service_name: [app]
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_global_streams_per_user: 1000
  max_query_series: 500

# Caches embutidos pequenos: o limite do container é 320 MiB (GOMEMLIMIT 256 MiB).
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 16

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 16

pattern_ingester:
  enabled: false

ruler:
  enable_api: false

analytics:
  reporting_enabled: false
