# Grafana Alloy (coletor de logs, sucessor do Promtail) como DaemonSet: um pod por nó, cada
# um lendo só os pods do PRÓPRIO nó (config.alloy filtra por spec.nodeName). Na VM há um
# nó só, então é 1 pod; se o cluster crescer, nenhum log é lido duas vezes.
#
# Sem hostPath: o Pod Security "baseline" do namespace proíbe (infra/vm/k8s/namespace-guard.yaml).
# O Alloy lê os logs pela API do Kubernetes (loki.source.kubernetes), com a Role fiapx-alloy
# (pods, pods/log) de infra/vm/k8s/observability-rbac.yaml, aplicada pelo root.
# Posições de leitura em emptyDir: num reinício ele relê o que o kubelet ainda guarda e o Loki
# descarta as linhas repetidas (mesmo stream, mesmo instante, mesmo texto).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: observability
spec:
  revisionHistoryLimit: 3
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1     # sai o velho, entra o novo: nunca dois lendo os mesmos pods
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/component: observability
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"
        prometheus.io/path: /metrics
    spec:
      priorityClassName: fiapx-app
      serviceAccountName: alloy
      automountServiceAccountToken: true   # lê pods e pods/log pela API
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 473                     # usuário "alloy" da imagem oficial
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
            - --stability.level=generally-available
            - --disable-reporting
          env:
            - name: GOMEMLIMIT
              value: 200MiB                # infra/vm/README.md, tabela 4.3
            # Usado no config.alloy para ler só os pods deste nó.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
