# Grafana: dashboards "FIAP Frames — Pipeline de vídeos" e "FIAP Frames — SLOs", Explore do Loki e a
# lista de alertas do Prometheus. Tudo provisionado como código (datasources, dashboards).
#
# SEM Ingress e SEM volume, de propósito:
#   - acesso só por "kubectl port-forward" (docs/observabilidade.md); nada público;
#   - o que importa (datasources, dashboards) vem do git; o SQLite do Grafana (sessões,
#     preferências) fica num emptyDir (o PVC de 256Mi da tabela 4.3 do infra/vm é opcional).
# Senha do admin: Secret fiapx-grafana (scripts/bootstrap-secrets.sh), lida por arquivo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      priorityClassName: fiapx-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 472                     # usuário "grafana" da imagem oficial
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:12.4.11@sha256:3ea272e5cab64a4a62240c682e2c62433b25614d956d44c299a10cb6994f6f2e
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER__FILE
              value: /etc/grafana/secrets/admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /etc/grafana/secrets/admin-password
            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"
            - name: GF_SECURITY_COOKIE_SAMESITE
              value: strict
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Acesso pelo port-forward (docs/observabilidade.md): http://localhost:3000
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:3000
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/fiapx-pipeline.json
            # Sem chamadas para fora (a VM é compartilhada; o pod não precisa de internet).
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_LOG_MODE
              value: console
            - name: GF_LOG_LEVEL
              value: warn
            - name: GF_PATHS_DATA
              value: /var/lib/grafana
            # SQLite em modo WAL: leituras (health, dashboards) não esperam as escritas das
            # tarefas de fundo do Grafana 12.
            - name: GF_DATABASE_WAL
              value: "true"
            # Medido no k3d: com 150MiB/192Mi (tabela 4.3 do infra/vm) o heap vivo do Grafana 12
            # (~150 MiB) encosta no GOMEMLIMIT, o GC roda sem parar, a CPU fica presa no teto e o
            # /api/health estoura o tempo (liveness reinicia o pod). 256MiB/320Mi fica estável.
            - name: GOMEMLIMIT
              value: 256MiB
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: secrets
              mountPath: /etc/grafana/secrets
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m                    # 250m: dashboards de 6-15 s com a CPU no teto (medido)
              memory: 320Mi
          # Primeiro boot: ~600 migrações do SQLite, ~45 s com 0,25 vCPU (medido). A startupProbe
          # segura a liveness até lá (até 5 min).
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # Tolerante de propósito: o Grafana não é caminho crítico; com o teto de 0,25 vCPU ele
          # às vezes demora a responder (tarefas de fundo) e reiniciar só pioraria.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: secrets
          secret:
            secretName: fiapx-grafana
            defaultMode: 0440
        - name: data
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
