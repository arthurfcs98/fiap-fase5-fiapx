# Prometheus v3: coleta os 3 apps, RabbitMQ, Garage, KEDA, cAdvisor e a própria stack de
# observabilidade; avalia as regras de SLO e os 10 alertas (contratos.md, seção 13).
#
# Retenção: 3 dias (contratos.md, seção 13) OU 400 MB, o que vier primeiro (o PVC tem
# 512Mi; infra/vm/README.md, seção 4.3). Os SLOs são de 7 dias: com 3 dias guardados, os SLIs
# "_7d" cobrem os dados que existem (até 3 dias); ver docs/observabilidade.md.
# Deployment com Recreate: o volume é ReadWriteOnce e o TSDB não aceita dois processos no
# mesmo diretório.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: observability
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      priorityClassName: fiapx-app
      serviceAccountName: prometheus
      automountServiceAccountToken: true   # precisa do token para o kubernetes_sd e o kubelet
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534                   # "nobody", usuário da imagem oficial
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=3d
            - --storage.tsdb.retention.size=400MB
            - --web.listen-address=:9090
            # Sem --web.enable-lifecycle/admin-api: ninguém recarrega nem apaga dados por HTTP.
            # Config nova = ConfigMap novo (hash) = rollout.
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: secrets
              mountPath: /etc/prometheus/secrets
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi           # GOMEMLIMIT automático (90% do limite) no Prometheus 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30   # replay do WAL depois de um reinício
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        # Só as duas credenciais de coleta, cada uma do seu Secret (projected: um diretório).
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: fiapx-metrics
                  items:
                    - key: METRICS_TOKEN
                      path: metrics-token
              - secret:
                  name: fiapx-garage
                  items:
                    - key: GARAGE_METRICS_TOKEN
                      path: garage-metrics-token
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
