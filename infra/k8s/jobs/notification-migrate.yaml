# Migrações do banco fiapx_notification (mesmas regras do video-api-migrate.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: notification-migrate
  labels:
    app.kubernetes.io/name: notification-migrate
    app.kubernetes.io/component: migrate
    fiapx.io/phase: migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  ttlSecondsAfterFinished: 21600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-migrate
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      priorityClassName: fiapx-lote       # Jobs saem antes dos serviços sob pressão
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/arthurfcs98/fiapx-notification-service
          imagePullPolicy: IfNotPresent
          args: ["node", "dist/migrate.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: fiapx_notification
            - name: DB_NAME
              value: fiapx_notification
            - name: DB_SSL
              value: "false"
            - name: DB_PASSWORD_FILE
              value: /run/secrets/fiapx/DB_PASSWORD
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/fiapx
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: secrets
          secret:
            secretName: fiapx-notification-service
            defaultMode: 0440
            items:
              - key: DB_PASSWORD
                path: DB_PASSWORD
