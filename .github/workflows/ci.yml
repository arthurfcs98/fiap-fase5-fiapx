# CI/CD do monorepo FIAP X.
# PR e push na main: qualidade (lint, typecheck, build, actionlint, hadolint, shellcheck),
# testes (cobertura >= 80% por project), integração (Testcontainers + ffmpeg), E2E do video-api,
# segurança (gitleaks no histórico inteiro + npm audit), validação dos manifestos K8s, build das 3
# imagens (UMA vez, com cache) e o E2E BDD no stack do compose com ESSAS imagens.
# Só no push na main, e só se tudo passou: as mesmas imagens testadas vão para o GHCR (sha-<7> e
# main) e o job `deploy` aplica o commit no K3s da VM (forced command SSH) com smoke público e
# rollback automático.
# O único check exigido na branch protection é o `ci-ok`.
#
# Actions de terceiros fixadas pelo SHA do commit (versão no comentário); o Dependabot
# (.github/dependabot.yml) abre PR quando sai versão nova. Imagens de ferramentas fixadas por
# tag + digest.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PR: cancela a execução superada. main: não cancela a que está rodando (serializa, o que
  # mantém a ordem da tag :main). Atenção: o GitHub guarda só UMA execução pendente por grupo;
  # com 3 pushes seguidos, a do meio é cancelada e aquele commit fica sem imagem sha-<7>.
  # Por isso o deploy sempre fixa o sha-<7> publicado pelo job `images`, nunca :main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  IMAGE_PREFIX: ghcr.io/arthurfcs98/fiapx
  APPS: video-api video-worker notification-service
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  quality:
    name: quality (lint, typecheck, build, linters de infra)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Login no Docker Hub (opcional, evita rate limit de pull anônimo)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: actionlint (workflows, com shellcheck nos run)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: hadolint (Dockerfile, regras em .hadolint.yaml)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint docker/node-service.Dockerfile
      - name: shellcheck (scripts)
        run: >-
          shellcheck -x scripts/*.sh scripts/demo/*.sh scripts/git-hooks/*.sh
          tests/fixtures/generate.sh docker/healthcheck.sh infra/postgres/init/*.sh

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: video-api, path: apps/video-api }
          - { name: video-worker, path: apps/video-worker }
          - { name: notification-service, path: apps/notification-service }
          - { name: common, path: libs/common }
          - { name: observability, path: libs/observability }
          - { name: messaging, path: libs/messaging }
          - { name: contracts, path: libs/contracts }
          - { name: storage, path: libs/storage }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Cada project roda sozinho: o threshold de 80% vale para ele isoladamente.
      - name: Cobertura (${{ matrix.path }})
        run: npm run test:cov -- ${{ matrix.path }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-${{ matrix.name }}
          path: coverage/${{ matrix.name }}
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: e2e (video-api, containers reais)
    # Testcontainers (Postgres, Redis, RabbitMQ, Garage com as imagens do compose.yaml): o
    # video-api inteiro (NestFactory, como o main.ts) com o worker simulado pelos eventos.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Login no Docker Hub (opcional, evita rate limit de pull anônimo)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: npm ci --ignore-scripts
      - run: npm run test:e2e

  integration:
    name: integration (RabbitMQ, Postgres, Garage e ffmpeg reais)
    # Testcontainers: cada arquivo `*.int-spec.ts` sobe os próprios containers (imagens e
    # digests lidos do compose.yaml). Inclui a regressão do requeue infinito da Fase 4, o worker
    # com ffmpeg real e o notification-service com Mailpit. Com CI=true, os testes do worker
    # FALHAM (em vez de pular) se o ffmpeg não estiver no PATH.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: ffmpeg/ffprobe (worker e tests/fixtures/generate.sh)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          ffmpeg -version | head -n1
      - name: Login no Docker Hub (opcional, evita rate limit de pull anônimo)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: npm ci --ignore-scripts
      - run: npm run test:int

  security:
    name: security (gitleaks no histórico, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # histórico inteiro: um segredo apagado depois continua no git
      - name: gitleaks (todos os commits, regras em .gitleaks.toml)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          "$GITLEAKS_IMAGE" git --redact --verbose --no-banner --config .gitleaks.toml /repo
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Não bloqueia: um aviso novo no registro do npm não pode travar a main sem mudança de
      # código. Aparece como passo com erro (amarelo) e no resumo; o Dependabot abre a correção.
      - name: npm audit (dependências de produção, severidade >= high; não bloqueia)
        continue-on-error: true
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning::npm audit encontrou vulnerabilidade high/critical em dependência de produção"
            exit 1
          fi

  k8s-validate:
    name: k8s-validate (kustomize, kubeconform, promtool, loki, alloy)
    # Valida os manifestos SEM cluster: kustomize dos overlays, regras do deploy.sh e orçamento
    # da quota, kubeconform estrito, promtool (config, regras e testes dos alertas), Loki, Alloy,
    # dashboards e shellcheck (infra/k8s/scripts/validate.sh).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Login no Docker Hub (opcional, evita rate limit de pull anônimo)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # js-yaml (usado pelo check-manifests.mjs) vem das dependências do monorepo.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # kubectl (kustomize embutido), jq e shellcheck já vêm na imagem ubuntu-24.04 do GitHub.
      - run: infra/k8s/scripts/validate.sh

  build-images:
    name: build image (${{ matrix.app }})
    # PR e main. Constrói UMA vez (cache do Actions) e exporta a imagem como artefato: o E2E BDD
    # sobe exatamente estas imagens e o job `images` publica exatamente estas imagens.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: video-api, ffmpeg: "false" }
          - { app: video-worker, ffmpeg: "true" }
          - { app: notification-service, ffmpeg: "false" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login no Docker Hub (opcional, evita rate limit de pull anônimo)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Versão de build (sha-<7>, igual à tag da imagem)
        id: version
        run: echo "app_version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Tags e labels OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: type=raw,value=${{ steps.version.outputs.app_version }}
          labels: |
            org.opencontainers.image.title=fiapx-${{ matrix.app }}
            org.opencontainers.image.source=https://github.com/arthurfcs98/fiap-fase5-fiapx
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}
      - name: Build (exporta a imagem para o artefato)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/node-service.Dockerfile
          build-args: |
            APP=${{ matrix.app }}
            WITH_FFMPEG=${{ matrix.ffmpeg }}
            APP_VERSION=${{ steps.version.outputs.app_version }}
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/image-${{ matrix.app }}.tar
          cache-from: type=gha,scope=image-${{ matrix.app }}
          # ignore-error: falha transitória do cache do Actions não derruba o build.
          cache-to: type=gha,mode=max,scope=image-${{ matrix.app }},ignore-error=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.app }}
          path: ${{ runner.temp }}/image-${{ matrix.app }}.tar
          retention-days: 1
          if-no-files-found: error

  e2e-bdd:
    name: e2e-bdd (compose com as imagens do build, 3 workers, smoke + BDD)
    # Sobe o stack COMPLETO (infra, migrações e os 3 apps com as imagens deste commit), roda o
    # smoke e depois os cenários BDD em pt-BR (tests/bdd/features) com jest-cucumber: vídeo
    # processado e zip baixado, vídeo corrompido -> FAILED + e-mail no Mailpit, isolamento e 401,
    # pico de 15 uploads com 3 workers sem perda, LGPD (aceite, exportação, eliminação,
    # retenção do zip) e logs sem dados pessoais.
    needs: [build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Retenção do zip curta (~43 s) para o cenário de retenção (igual ao `make bdd-up`).
      ZIP_RETENTION_DAYS: "0.0005"
      DATA_RETENTION_INTERVAL_S: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Login no Docker Hub (opcional, evita rate limit de pull anônimo)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Carrega as imagens do build (sem rebuild)
        run: |
          for tar in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$tar"; done
          # O shell ganha do .env no compose e no smoke: sobe e confere a tag deste commit.
          echo "FIAPX_IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "APP_VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - name: Segredos locais efêmeros (.env)
        run: ./scripts/dev-secrets.sh
      - name: Valida o compose
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          docker compose config --quiet
      - name: Sobe o stack (3 workers) e espera healthy
        run: docker compose up -d --no-build --wait --wait-timeout 300 --scale video-worker=3
      - name: Smoke
        run: ./scripts/compose-smoke.sh
      - name: BDD (jest-cucumber)
        run: npm run test:bdd
      - name: Logs do compose (em caso de falha)
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7
      - name: Derruba o stack
        if: always()
        run: docker compose down -v --remove-orphans

  images:
    name: publish images (GHCR)
    # Só no push na main e só com todos os jobs de verificação verdes. Publica as MESMAS
    # imagens que passaram no E2E (artefatos do build-images), sem rebuild.
    needs: [quality, test, e2e, integration, security, k8s-validate, e2e-bdd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Carrega as imagens testadas
        run: for tar in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$tar"; done
      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push sha-<7> e main
        id: push
        run: |
          tag="sha-${GITHUB_SHA::7}"
          {
            echo "### Imagens publicadas (${tag})"
            echo ""
            echo "| Imagem | Digest |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for app in $APPS; do
            image="${IMAGE_PREFIX}-${app}"
            docker push "${image}:${tag}"
            docker tag "${image}:${tag}" "${image}:main"
            docker push "${image}:main"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:${tag}")"
            echo "| \`${image}:${tag}\` | \`${digest#*@}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  ci-ok:
    name: ci-ok
    # Agregador: único check exigido na branch protection. Falha se qualquer job falhou ou
    # foi cancelado; `skipped` é aceito (o `images` só roda no push na main).
    if: always()
    needs: [quality, test, e2e, integration, security, k8s-validate, build-images, e2e-bdd, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Resultado dos jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  # ---------------------------------------------------------------------------------- CD --
  # Depois que o `ci-ok` passou na main (qualidade + testes + E2E + imagens sha-<7> no GHCR):
  #   1. configura o SSH com a chave RESTRITA e o host key FIXADO (sem TOFU);
  #   2. `ssh fiapx-vm "deploy <sha40>"`: a chave só consegue rodar /opt/fiapx/bin/deploy.sh
  #      (forced command, fonte em infra/vm/deploy.sh), que renderiza infra/k8s/overlays/prod com
  #      as imagens ghcr.io/arthurfcs98/fiapx-<app>:sha-<7> fixadas por digest, roda os Jobs de
  #      setup/migração e espera o rollout. O log do deploy aparece aqui, ao vivo;
  #   3. smoke público: https://frames.asdevit.com/api/health/live (endereço oficial, TLS Full
  #      strict na Cloudflare) precisa responder version == sha-<7> deste commit; o host técnico
  #      https://fiapx.asdevit.com só redireciona (308) para ele na borda, conferido como aviso;
  #   4. se o smoke falhar: `ssh fiapx-vm rollback` e o job fica vermelho.
  # Pré-requisitos (infra/vm/README.md, "Primeiro deploy"): environment `production` com
  # "Deployment branches: main" e os secrets DE ENVIRONMENT VM_HOST, VM_SSH_KEY e
  # VM_KNOWN_HOSTS; os 3 pacotes GHCR fiapx-* públicos; na VM, a instalação da README (seção 5)
  # e as correções pós-instalação (seção 0.2).
  # Códigos do deploy.sh: 0 ok | 1 falhou e revertido | 2 pedido inválido | 3 rollback falhou
  #   | 4 downgrade recusado | 5 commit já marcado como ruim | 75 lock ocupado | 255 = erro do ssh.
  # Nenhuma action de terceiros neste job: só o `ssh` e o `curl` do runner.
  deploy:
    name: deploy (K3s na VM)
    needs: [ci-ok, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Worker em Recreate espera até 720 s o vídeo em curso (ROLLOUT_TIMEOUT do deploy.sh: 900 s);
    # com Jobs, rollout, um rollback no pior caso (outro rollout) e o smoke, 45 min cabem.
    timeout-minutes: 45
    permissions: {} # não faz checkout nem usa o GITHUB_TOKEN
    environment: # secrets de environment: só jobs da main (regra do environment) os leem
      name: production
      url: https://frames.asdevit.com # endereço público oficial (contratos.md, seção 14)
    concurrency: # um deploy por vez; um pendente mais novo substitui o pendente antigo
      group: deploy-production
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ github.sha }}
      PUBLIC_URL: https://frames.asdevit.com # endereço oficial (Full strict); decide o rollback
      LEGACY_URL: https://fiapx.asdevit.com # host técnico: na borda só redireciona (308) ao oficial
    steps:
      - name: SSH (chave restrita + host key fixado)
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VM_HOST VM_SSH_KEY VM_KNOWN_HOSTS; do
            [[ -n ${!name} ]] || { echo "::error::secret $name ausente no environment production"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/fiapx_deploy
          chmod 600 ~/.ssh/fiapx_deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host fiapx-vm
            HostName ${VM_HOST}
            User fiapx-deploy
            IdentityFile ~/.ssh/fiapx_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            LogLevel ERROR
          CFG
          chmod 600 ~/.ssh/config

      - name: Deploy no K3s (forced command na VM)
        run: |
          rc=0
          for attempt in 1 2; do
            rc=0
            # shellcheck disable=SC2029  # expandir no runner é o desejado: a VM recebe "deploy <sha40>"
            ssh fiapx-vm "deploy ${RELEASE_SHA}" || rc=$?
            # 255 = falha do próprio ssh. Repetir é seguro: o worker da VM é destacado e usa lock;
            # se a 1ª tentativa já tinha falhado e revertido, a VM recusa o mesmo SHA (código 5)
            # em vez de refazer o deploy ruim (e o downtime) uma segunda vez.
            [[ $rc -ne 255 ]] && break
            echo "::warning::ssh falhou (tentativa ${attempt}); repetindo em 20 s"; sleep 20
          done
          case $rc in
            0) ;;
            1) echo "::error::deploy falhou; a VM voltou para a release anterior (ou nada foi aplicado)"; exit 1 ;;
            2) echo "::error::pedido recusado pelo forced command"; exit 1 ;;
            3) echo "::error::deploy falhou E o rollback falhou: intervenção manual na VM"; exit 1 ;;
            4) echo "::error::downgrade recusado: este commit é mais antigo que a release atual (use o rollback)"; exit 1 ;;
            5) echo "::error::este commit já falhou e foi revertido na VM (lista 'bad'); nada foi aplicado. Corrija com um commit novo (liberar o mesmo SHA: README da infra/vm, seção 9)"; exit 1 ;;
            75) echo "::error::outro deploy segurou o lock da VM por 15 min"; exit 1 ;;
            *) echo "::error::deploy terminou com código ${rc}"; exit 1 ;;
          esac

      - name: Smoke público (Cloudflare -> Caddy -> Traefik -> video-api)
        id: smoke
        run: |
          set -uo pipefail
          expected="sha-${RELEASE_SHA::7}"      # APP_VERSION que o job de imagens grava em cada imagem
          ua="fiapx-smoke/1.0 (+github-actions)"
          ver=""
          for i in $(seq 1 24); do              # até 2 min
            hdr=$(mktemp)
            body=$(curl -sS --max-time 8 -A "$ua" -H 'Cache-Control: no-cache' -D "$hdr" "$PUBLIC_URL/api/health/live" || true)
            if grep -qi '^cf-mitigated:' "$hdr"; then
              echo "::error::a Cloudflare desafiou o runner (cf-mitigated). Crie uma regra WAF de skip para /api/health/*"; exit 1
            fi
            ver=$(jq -r '.version // empty' <<<"$body" 2>/dev/null || true)
            [[ $ver == "$expected" ]] && break
            echo "tentativa $i: version='${ver:-?}' esperada=${expected}"; sleep 5
          done
          [[ $ver == "$expected" ]] || { echo "::error::$PUBLIC_URL/api/health/live não mostra ${expected}"; exit 1; }
          echo "publicado: ${ver}"
          ready=$(curl -sS --max-time 8 -A "$ua" -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/health/ready" || true)
          [[ $ready == 200 ]] || { echo "::error::$PUBLIC_URL/api/health/ready respondeu ${ready:-?}"; exit 1; }
          legacy=$(curl -sS --max-time 8 -A "$ua" -o /dev/null -w '%{http_code} %{redirect_url}' "$LEGACY_URL/api/health/live" 2>/dev/null || true)
          [[ $legacy == "308 $PUBLIC_URL/api/health/live" ]] || echo "::warning::$LEGACY_URL respondeu '${legacy:-?}' (esperado 308 para $PUBLIC_URL): confira o fiapx.caddy na borda"
          echo "### Deploy ${expected}: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback (smoke público falhou)
        if: failure() && steps.smoke.outcome == 'failure'
        run: ssh fiapx-vm rollback

      - name: Apagar a chave do runner
        if: always()
        run: rm -f ~/.ssh/fiapx_deploy
