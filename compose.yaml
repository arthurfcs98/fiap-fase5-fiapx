# =============================================================================
# FIAP X — stack local (dev) e do CI (E2E/smoke).
#
#   make up        # gera o .env (segredos locais) e sobe tudo com build: docker compose up --wait
#   make up WORKERS=3                              # idem, com 3 réplicas do video-worker
#   docker compose up -d --scale video-worker=3    # escala os workers com o stack já no ar
#   make down      # derruba (mantém volumes)   ·   make down-v   # derruba e apaga volumes
#
# Ordem de subida: infra (healthy) → one-shots (garage-init, video-api-migrate,
# notification-migrate) → apps. Os apps só sobem depois que as migrações terminaram com sucesso.
#
# Imagens de infra fixadas por tag + digest (multi-arch). Segredos só pelo .env (gitignored)
# gerado por scripts/dev-secrets.sh. Todas as portas publicadas apenas em 127.0.0.1.
# Este compose é de desenvolvimento e do CI; a produção roda no K3s (manifests da E1).
# =============================================================================
name: fiapx

x-app-build: &app-build
  context: .
  dockerfile: docker/node-service.Dockerfile

# Build args comuns aos 3 apps (o healthcheck deriva a URL do APP, sem build-arg).
x-app-build-args: &app-build-args
  APP_VERSION: ${APP_VERSION:-dev}
  VCS_REF: ${VCS_REF:-unknown}

# Endurecimento comum aos 3 apps: FS somente leitura, sem capabilities, sem escalada e com
# teto de memória/CPU (o worker sobrescreve: o ffmpeg precisa de mais).
x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 512m
  cpus: 1
  restart: unless-stopped

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}

# Variáveis de dependências (nomes em docs/arquitetura/contratos.md, seção 10), já prontas para
# as etapas E3-E5: cada app só lê as chaves do próprio schema de config (as demais são ignoradas).
x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_URL: amqp://fiapx:${RABBITMQ_PASSWORD:?rode scripts/dev-secrets.sh}@rabbitmq:5672

x-s3-env: &s3-env
  S3_ENDPOINT: http://garage:3900
  S3_REGION: garage
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?rode scripts/dev-secrets.sh}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?rode scripts/dev-secrets.sh}
  S3_BUCKET_RAW: fiapx-raw
  S3_BUCKET_ZIPS: fiapx-zips
  S3_FORCE_PATH_STYLE: "true"

# Banco de cada serviço (usuário e banco próprios, criados por infra/postgres/init). Os
# one-shots de migração recebem SÓ estas variáveis (o schema de config deles não pede mais nada).
x-video-db-env: &video-db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: fiapx_video
  DB_PASSWORD: ${VIDEO_DB_PASSWORD:?rode scripts/dev-secrets.sh}
  DB_NAME: fiapx_video
  DB_SSL: "false"

x-notification-db-env: &notification-db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: fiapx_notification
  DB_PASSWORD: ${NOTIF_DB_PASSWORD:?rode scripts/dev-secrets.sh}
  DB_NAME: fiapx_notification
  DB_SSL: "false"

# One-shot de migração: mesmo endurecimento dos apps, sem restart (roda uma vez e sai com 0).
x-migrate-hardening: &migrate-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 256m
  cpus: 0.5
  restart: "no"
  command: ["node", "dist/migrate.js"]
  # A imagem tem HEALTHCHECK de app; o one-shot não serve HTTP.
  healthcheck:
    disable: true

services:
  # ---------------------------------------------------------------- infra --
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: fiapx
      POSTGRES_DB: fiapx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode scripts/dev-secrets.sh}
      VIDEO_DB_PASSWORD: ${VIDEO_DB_PASSWORD:?rode scripts/dev-secrets.sh}
      NOTIF_DB_PASSWORD: ${NOTIF_DB_PASSWORD:?rode scripts/dev-secrets.sh}
    # LGPD (contratos.md, seção 12): sem DETAIL/HINT nos logs (ex.: "Key (email)=(...) already
    # exists" numa corrida de cadastro) e sem valores de parâmetros (igual ao StatefulSet do K8s).
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_parameter_max_length=0"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1 (TCP): o servidor temporário do initdb só escuta no socket unix, então o
      # healthcheck não fica verde antes do restart que encerra os scripts de init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fiapx -d fiapx"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [interna]
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # Sem persistência (cache, throttling e anti-replay são efêmeros por natureza).
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?rode scripts/dev-secrets.sh}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [interna]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine@sha256:1aab4d911053f3ee4ff9bb231f5192ebd6a12281f8044910256a667fdb04108d
    # Hostname fixo: o nome do nó (rabbit@rabbitmq) não muda ao recriar o container,
    # senão as filas "somem" do volume.
    hostname: rabbitmq
    # Usuário e vhost conforme docs/arquitetura/contratos.md (RABBITMQ_URL amqp://fiapx:***@rabbitmq:5672, vhost "/").
    environment:
      RABBITMQ_DEFAULT_USER: fiapx
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?rode scripts/dev-secrets.sh}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [interna, worker]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [interna]
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?rode scripts/dev-secrets.sh}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?rode scripts/dev-secrets.sh}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?rode scripts/dev-secrets.sh}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "127.0.0.1:${GARAGE_S3_HOST_PORT:-3900}:3900"
      - "127.0.0.1:${GARAGE_ADMIN_HOST_PORT:-3903}:3903"
    # A imagem é "scratch" (sem shell/curl): o próprio binário checa o nó via RPC.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [interna, worker]
    restart: unless-stopped

  # One-shot idempotente: layout do nó, chave S3 local e buckets fiapx-raw/fiapx-zips.
  garage-init:
    image: node:22.23-alpine3.24@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "/init/init.mjs"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?rode scripts/dev-secrets.sh}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?rode scripts/dev-secrets.sh}
      GARAGE_BUCKETS: fiapx-raw,fiapx-zips
    volumes:
      - ./infra/garage/init.mjs:/init/init.mjs:ro
    depends_on:
      garage:
        condition: service_healthy
    networks: [interna]
    restart: "no"

  # One-shots de migração (TypeORM, SQL versionado; idempotentes). Usam a MESMA imagem do app
  # (dist/migrate.js), como o Job de migração do K8s (infra/k8s/jobs).
  video-api-migrate:
    image: ${FIAPX_IMAGE_PREFIX:-ghcr.io/arthurfcs98/fiapx}-video-api:${FIAPX_IMAGE_TAG:-local}
    <<: *migrate-hardening
    environment:
      <<: [*app-env, *video-db-env]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  notification-migrate:
    image: ${FIAPX_IMAGE_PREFIX:-ghcr.io/arthurfcs98/fiapx}-notification-service:${FIAPX_IMAGE_TAG:-local}
    <<: *migrate-hardening
    environment:
      <<: [*app-env, *notification-db-env]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  # ----------------------------------------------------------------- apps --
  video-api:
    build:
      <<: *app-build
      args:
        <<: *app-build-args
        APP: video-api
    image: ${FIAPX_IMAGE_PREFIX:-ghcr.io/arthurfcs98/fiapx}-video-api:${FIAPX_IMAGE_TAG:-local}
    <<: *app-hardening
    environment:
      <<: [*app-env, *rabbitmq-env, *s3-env, *video-db-env]
      PORT: "3000"
      METRICS_PORT: "9464"
      METRICS_TOKEN: ${METRICS_TOKEN:?rode scripts/dev-secrets.sh}
      REDIS_URL: redis://:${REDIS_PASSWORD:?rode scripts/dev-secrets.sh}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?rode scripts/dev-secrets.sh}
      JWT_EXPIRES_IN: "3600"
      DOWNLOAD_URL_SECRET: ${DOWNLOAD_URL_SECRET:?rode scripts/dev-secrets.sh}
      PUBLIC_BASE_URL: http://localhost:${API_HOST_PORT:-8080}
      MAX_UPLOAD_MB: "95"
      # LGPD (contratos.md, seção 12). Os testes BDD encurtam a retenção (make test-bdd).
      ZIP_RETENTION_DAYS: ${ZIP_RETENTION_DAYS:-7}
      DATA_RETENTION_INTERVAL_S: ${DATA_RETENTION_INTERVAL_S:-3600}
      # Anti-abuso: login fica no valor do contrato (5/min); cadastro e upload ficam folgados no
      # stack local/CI (BDD e k6 cadastram muitos usuários do mesmo IP). Produção usa o padrão.
      THROTTLE_REGISTER_LIMIT: ${THROTTLE_REGISTER_LIMIT:-1000}
      THROTTLE_LOGIN_LIMIT: ${THROTTLE_LOGIN_LIMIT:-5}
      THROTTLE_UPLOAD_LIMIT: ${THROTTLE_UPLOAD_LIMIT:-600}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      video-api-migrate:
        condition: service_completed_successfully
    networks: [interna]

  video-worker:
    build:
      <<: *app-build
      args:
        <<: *app-build-args
        APP: video-worker
        WITH_FFMPEG: "true"
    image: ${FIAPX_IMAGE_PREFIX:-ghcr.io/arthurfcs98/fiapx}-video-worker:${FIAPX_IMAGE_TAG:-local}
    <<: *app-hardening
    # /work é um tmpfs POR RÉPLICA (nunca um volume compartilhado: com --scale, dois workers
    # no mesmo volume disputariam /work/<videoId>). O tmpfs conta na memória do container, por
    # isso o teto de 2 GiB (1 GiB de /work + Node + ffmpeg). No K8s é um emptyDir por pod.
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:size=64m
      - /work:size=1g,uid=1000,gid=1000,mode=0700
    environment:
      <<: [*app-env, *rabbitmq-env, *s3-env]
      METRICS_PORT: "9464"
      METRICS_TOKEN: ${METRICS_TOKEN:?rode scripts/dev-secrets.sh}
      WORKER_PREFETCH: "1"
      WORK_DIR: /work
      FFMPEG_TIMEOUT_MS: "600000"
      MAX_VIDEO_DURATION_S: "600"
    # Termina o vídeo em andamento antes de sair (SHUTDOWN_GRACE_MS=300s + folga, na E4).
    stop_grace_period: 330s
    depends_on:
      rabbitmq:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    # Rede interna sem saída para a internet: o worker só fala com RabbitMQ e Garage.
    networks: [worker]

  notification-service:
    build:
      <<: *app-build
      args:
        <<: *app-build-args
        APP: notification-service
    image: ${FIAPX_IMAGE_PREFIX:-ghcr.io/arthurfcs98/fiapx}-notification-service:${FIAPX_IMAGE_TAG:-local}
    <<: *app-hardening
    environment:
      <<: [*app-env, *rabbitmq-env, *notification-db-env]
      METRICS_PORT: "9464"
      METRICS_TOKEN: ${METRICS_TOKEN:?rode scripts/dev-secrets.sh}
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: FIAP Frames <nao-responda@fiapx.local>
      NOTIFY_ON_SUCCESS: "true"
      # Link dos e-mails (a página do app) e retenção LGPD das notificações (seção 12).
      PUBLIC_BASE_URL: http://localhost:${API_HOST_PORT:-8080}
      NOTIFICATION_RETENTION_DAYS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    networks: [interna]

networks:
  interna: {}
  worker:
    internal: true

volumes:
  pgdata:
  rabbitmq:
  garage_meta:
  garage_data:
